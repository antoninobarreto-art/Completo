<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥋 DOJOCHO - Redefinição de Senha</title>
    <!-- Fonts & Style -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-dark); padding: 1.5rem;">

    <div style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-highlight); border-radius: var(--radius-lg); padding: 2.5rem 2rem; box-shadow: var(--shadow-glow); position: relative;">
        
        <!-- LOGO HEADER -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), var(--accent-cyan)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: white; margin: 0 auto 1rem auto; box-shadow: 0 4px 20px var(--primary-glow);">
                合
            </div>
            <h1 style="font-size: 1.8rem; color: white; margin-bottom: 0.3rem;">RioAiki DOJOCHO</h1>
            <p style="font-size: 0.9rem; color: var(--accent-cyan); font-weight: 600;">Redefinição de Senha do Usuário</p>
        </div>

        {% if error %}
            <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #FDA4AF; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        {% if token_valid %}
        <!-- FORMULÁRIO DE NOVA SENHA -->
        <form action="/api/reset-password" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
            <input type="hidden" name="token" value="{{ token }}">

            <div class="form-group">
                <label class="form-label" style="display: flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-key" style="color: var(--accent-amber);"></i> Nova Senha
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" name="new_password" id="new-password-input" class="form-input" required placeholder="••••••••" style="padding: 0.75rem 2.5rem 0.75rem 1rem; width: 100%;">
                    <button type="button" onclick="togglePasswordVisibility('new-password-input', 'toggle-new-password-icon')" style="position: absolute; right: 0.75rem; background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0.25rem; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s;" title="Mostrar / Ocultar Senha">
                        <i class="fa-solid fa-eye" id="toggle-new-password-icon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" style="display: flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-check-double" style="color: var(--accent-emerald);"></i> Confirmar Nova Senha
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" name="confirm_password" id="confirm-password-input" class="form-input" required placeholder="••••••••" style="padding: 0.75rem 2.5rem 0.75rem 1rem; width: 100%;">
                    <button type="button" onclick="togglePasswordVisibility('confirm-password-input', 'toggle-confirm-password-icon')" style="position: absolute; right: 0.75rem; background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0.25rem; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s;" title="Mostrar / Ocultar Senha">
                        <i class="fa-solid fa-eye" id="toggle-confirm-password-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700; margin-top: 0.5rem;">
                <i class="fa-solid fa-floppy-disk"></i> Salvar Nova Senha
            </button>
        </form>
        {% else %}
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/login" class="btn btn-secondary" style="width: 100%;">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para a Tela de Login
                </a>
            </div>
        {% endif %}

    </div>

    <script>
    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input && icon) {
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.style.color = 'var(--accent-cyan)';
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.style.color = 'var(--text-dim)';
            }
        }
    }
    </script>
</body>
</html>
