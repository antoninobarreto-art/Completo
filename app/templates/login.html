<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥋 DOJOCHO - Login RioAiki</title>
    <!-- Fonts & Style -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-dark); padding: 1.5rem;">

    <div style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-highlight); border-radius: var(--radius-lg); padding: 2.5rem 2rem; box-shadow: var(--shadow-glow); position: relative; overflow: hidden;">
        
        <!-- LOGO HEADER -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), var(--accent-cyan)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: white; margin: 0 auto 1rem auto; box-shadow: 0 4px 20px var(--primary-glow);">
                合
            </div>
            <h1 style="font-size: 1.8rem; color: white; margin-bottom: 0.3rem;">RioAiki DOJOCHO</h1>
            <p style="font-size: 0.9rem; color: var(--accent-cyan); font-weight: 600;">Autenticação & Controle de Acesso IAM</p>
        </div>

        {% if error %}
            <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #FDA4AF; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        {% if msg %}
            <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.6rem; font-weight: 600;">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>{{ msg }}</span>
                </div>
            </div>
        {% endif %}

        <!-- FORMULÁRIO DE LOGIN -->
        <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
            <div class="form-group">
                <label class="form-label" style="display: flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-envelope" style="color: var(--accent-cyan);"></i> E-mail de Acesso
                </label>
                <input type="email" name="email" id="email-input" class="form-input" required placeholder="ex: admin@rioaiki.com.br" style="padding: 0.75rem 1rem;">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label class="form-label" style="display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0;">
                        <i class="fa-solid fa-lock" style="color: var(--primary);"></i> Senha
                    </label>
                    <button type="button" class="btn btn-link" style="font-size: 0.8rem; color: var(--accent-cyan); text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0;" onclick="openForgotPasswordModal()">
                        <i class="fa-solid fa-circle-question"></i> Esqueceu a senha?
                    </button>
                </div>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" name="password" id="password-input" class="form-input" required placeholder="••••••••" style="padding: 0.75rem 2.5rem 0.75rem 1rem; width: 100%;">
                    <button type="button" onclick="togglePasswordVisibility('password-input', 'toggle-password-icon')" style="position: absolute; right: 0.75rem; background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0.25rem; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: color 0.2s;" title="Mostrar / Ocultar Senha">
                        <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700; margin-top: 0.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
            </button>
        </form>
    </div>

    <!-- MODAL ESQUECEU A SENHA -->
    <div class="modal-backdrop" id="modal-forgot-password">
        <div class="modal-content" style="max-width: 440px;">
            <div class="modal-header">
                <h3 style="color: white;"><i class="fa-solid fa-key"></i> Recuperar Senha</h3>
                <button class="modal-close" onclick="closeForgotPasswordModal()">&times;</button>
            </div>
            <form action="/api/forgot-password" method="POST">
                <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.2rem; line-height: 1.5;">
                    Digite seu e-mail cadastrado para receber as instruções e o link seguro para redefinição de senha.
                </p>
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label class="form-label"><i class="fa-solid fa-envelope" style="color: var(--accent-cyan);"></i> E-mail Cadastrado</label>
                    <input type="email" name="email" class="form-input" required placeholder="ex: seuemail@rioaiki.com.br">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-paper-plane"></i> Enviar E-mail de Redefinição
                </button>
            </form>
        </div>
    </div>

    <script>
    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input && icon) {
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.style.color = 'var(--accent-cyan)';
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.style.color = 'var(--text-dim)';
            }
        }
    }

    function openForgotPasswordModal() {
        const modal = document.getElementById('modal-forgot-password');
        if (modal) modal.classList.add('active');
    }

    function closeForgotPasswordModal() {
        const modal = document.getElementById('modal-forgot-password');
        if (modal) modal.classList.remove('active');
    }
    </script>
</body>
</html>
